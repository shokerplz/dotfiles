stages:
  - maintenance

daily-update:
  stage: maintenance
  image: nixos/nix:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      cat <<INNEREOF > update-script.sh
      set -e
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      # Handle SSH_PRIVATE_KEY
      if [ -f "\$SSH_PRIVATE_KEY" ]; then
          cp "\$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      else
          echo "\$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
      fi

      chmod 600 ~/.ssh/id_ed25519
      # Ensure newline at EOF
      if [ -n "\$(tail -c1 ~/.ssh/id_ed25519)" ]; then
          echo "" >> ~/.ssh/id_ed25519
      fi

      echo "--- DEBUG: KEY INFO ---"
      ls -l ~/.ssh/id_ed25519
      ssh-keygen -lf ~/.ssh/id_ed25519
      echo "-----------------------"

      ssh-keyscan git.ikovalev.nl >> ~/.ssh/known_hosts

      # Configure Git
      git config --global user.email "ci-bot@ikovalev.nl"
      git config --global user.name "CI Bot"

      # TEST CONNECTION
      echo "--- DEBUG: TESTING SSH CONNECTION ---"
      # We ignore exit code 1 here because ssh -T usually returns 1 even on success (Welcome message) in scripts
      ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -T git@git.ikovalev.nl || true
      echo "-------------------------------------"

      # Set SSH remote
      git remote set-url origin git@git.ikovalev.nl:nix/dotfiles.git
      export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

      # Checkout daily branch
      echo "Fetching daily branch..."
      git fetch origin daily
      git checkout daily

      # Update Flake
      nix --extra-experimental-features 'nix-command flakes' flake update

      # Commit and Trigger Build
      if [[ -n \$(git status -s) ]]; then
        git add flake.lock
        git commit -m "Update flake.lock [skip ci]"
        git push origin daily
        
        echo "Changes pushed. Triggering build on nix-local-cache..."
        curl -X POST http://media-server:21080/build \
             -H "Content-Type: application/json" \
             -d '{"flake_branch": "daily"}'
      else
        echo "No changes in flake.lock. Skipping commit and build."
      fi
      INNEREOF
    
    - nix-shell -p git openssh curl --run "bash update-script.sh"
