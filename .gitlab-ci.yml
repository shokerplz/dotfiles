stages:
  - maintenance

daily-update:
  stage: maintenance
  image: nixos/nix:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      cat <<INNEREOF > update-script.sh
      set -e
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      # Handle SSH_PRIVATE_KEY whether it's a File or a Variable
      if [ -f "\$SSH_PRIVATE_KEY" ]; then
          echo "SSH_PRIVATE_KEY detected as file"
          cp "\$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      else
          echo "SSH_PRIVATE_KEY detected as variable"
          echo "\$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
      fi

      # Ensure permissions and fix potential missing newline at EOF
      chmod 600 ~/.ssh/id_ed25519
      if [ -n "\$(tail -c1 ~/.ssh/id_ed25519)" ]; then
          echo "" >> ~/.ssh/id_ed25519
      fi

      # Start agent and add key
      eval \$(ssh-agent -s)
      ssh-add ~/.ssh/id_ed25519
      
      ssh-keyscan git.ikovalev.nl >> ~/.ssh/known_hosts

      # Configure Git
      git config --global user.email "ci-bot@ikovalev.nl"
      git config --global user.name "CI Bot"

      # Checkout daily branch
      git fetch origin daily
      git checkout daily

      # Update Flake
      nix flake update

      # Commit and Trigger Build
      if [[ -n \$(git status -s) ]]; then
        git add flake.lock
        git commit -m "Update flake.lock [skip ci]"
        git push origin daily
        
        echo "Changes pushed. Triggering build on nix-local-cache..."
        curl -X POST http://media-server:21080/build \
             -H "Content-Type: application/json" \
             -d '{"flake_branch": "daily"}'
      else
        echo "No changes in flake.lock. Skipping commit and build."
      fi
      INNEREOF
    
    - nix-shell -p git openssh curl --run "bash update-script.sh"
